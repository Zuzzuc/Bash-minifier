name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          set -euo pipefail
          reported="$(bash bash-minifier.sh -V)"
          expected="${GITHUB_REF_NAME#v}"
          [[ "$reported" == "$expected" ]] || {
            echo "Script reports $reported, tag is $GITHUB_REF_NAME"
            exit 1
          }

      - name: Checksum
        run: sha256sum bash-minifier.sh > bash-minifier.sh.sha256

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: bash-minifier.sh

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            bash-minifier.sh bash-minifier.sh.sha256
